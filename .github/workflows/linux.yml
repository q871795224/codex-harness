name: Linux package

on:
  pull_request:
    branches: [main]
  # Populate a base-branch cache that subsequent PRs can restore.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select Rust
        run: rustup default stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Debian package
        run: pnpm tauri:build:linux
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: codex-harness-linux-amd64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
